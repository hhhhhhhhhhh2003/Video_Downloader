name: Build Executable with Nuitka

on:
  push:
    branches: [ main ]
  workflow_dispatch: # 允许手动触发

jobs:
  build:
    runs-on: windows-latest  # 必须使用 windows 环境以自带 MSVC

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: 'x64'
          cache: 'pip' # 开启缓存加速后续构建

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nuitka
          pip install 'flet[all]'
          pip install yt-dlp

      - name: Build with Nuitka
        shell: pwsh
        run: |
          python -m nuitka `
            --standalone `
            --onefile `
            --msvc=latest `
            --assume-yes-for-downloads `
            --show-progress `
            --show-scons `
            --jobs=2 `
            --output-dir=dist `
            main.py  # <--- 这里改成你的主程序文件名

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-executable
          path: dist/*.exe
