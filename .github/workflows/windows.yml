name: Build Executable with Nuitka

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: 'x64'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nuitka
          pip install 'flet[all]'
          pip install yt-dlp

      - name: Build with Nuitka
        shell: pwsh
        run: |
          $env:TMP = "${{ github.workspace }}\temp"
          $env:TEMP = "${{ github.workspace }}\temp"
          New-Item -ItemType Directory -Force -Path $env:TMP

          $nuitkaArgs = @(
              '--standalone',
              '--msvc=latest',
              '--assume-yes-for-downloads',
              '--nofollow-import-to=rich',
              '--nofollow-import-to=tkinter',
              '--nofollow-import-to=yt_dlp',
              '--nofollow-import-to=yt_dlp.extractor',
              '--nofollow-import-to=yt_dlp.downloader',
              '--enable-plugin=pylint-warnings',
              '--output-dir=build',
              '--low-memory',
              '--lto=no',
              '--show-scons',
              '--jobs=1',
              'main.py'
          )

          python -m nuitka @nuitkaArgs

      - name: Upload Crash Report (if any)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nuitka-crash-report
          path: nuitka-crash-report.xml

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-executable
          path: build/main.dist
