name: Nuitka Build Windows
on: 
  workflow_dispatch: # 支持手动点击运行
  push:
    tags:
      - 'v*'      # 推送标签时触发

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install nuitka zstandard
          if (Test-Path requirements.txt) { pip install -r requirements.txt }

      # Windows 建议加上 --windows-disable-console（如果是 GUI 程序）
      - name: Build with Nuitka
        run: |
          python -m nuitka `
            --standalone `
            --onefile `
            --output-dir=dist `
            --msvc=latest `
            main.py
        # 注意：Windows 换行符在 PowerShell 里是 ` (反引号)

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Executable
          path: dist/*.exe
